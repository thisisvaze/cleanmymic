[project]
name = "cleanmymic"
version = "0.1.0a1"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "soundfile", "pyroomacoustics", "torch", "coremltools; sys_platform == 'darwin'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
eval = ["transformers", "jiwer", "audiobox_aesthetics", "requests"]  # audiobox_aesthetics imports requests without declaring it
